[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civicbench"
version = "0.1.0"
description = "Load CivicBench and attack your own video detector with the benchmark's protocol (PGD, APGD and Square on the 8-bit grid)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"            # SPDX expression (PEP 639); it replaces the License classifier, which setuptools now rejects alongside it
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Mert Onur Cakiroglu" },
    { name = "Elham Buxton" },
    { name = "Mehmet Dalkilic" },
    { name = "Hasan Kurban" },
]
keywords = ["video", "deepfake detection", "adversarial robustness", "benchmark", "generated video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21", "torch>=1.13"]

[project.optional-dependencies]
data = ["pyarrow>=10", "Pillow>=9", "datasets>=2.14"]
fancy = ["rich>=13"]
test = ["pytest>=7"]
# Tau-Anchor (tau_anchor/, used from a clone of this repository): scoring, and retraining
tau-anchor = ["torch>=2.0", "huggingface_hub>=0.20"]
tau-anchor-train = ["torch>=2.0", "huggingface_hub>=0.20", "scikit-learn>=1.0", "av>=10", "Pillow>=9"]

[project.urls]
Homepage = "https://github.com/KurbanIntelligenceLab/CivicBench"
Documentation = "https://github.com/KurbanIntelligenceLab/CivicBench/blob/main/docs/toolkit.md"
Dataset = "https://huggingface.co/datasets/kurbanintelligencelab/CivicBench-real"
Issues = "https://github.com/KurbanIntelligenceLab/CivicBench/issues"

[project.scripts]
civicbench = "civicbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
